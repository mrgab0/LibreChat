version: 1.3.4
cache: true

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts:
    use: true
    create: true
  bookmarks: true
  multiConvo: true

# Configured Endpoints for Free APIs
endpoints:
  google:
    apiKey: "${GEMINI_API_KEY}"
    models:
      default:
        - "gemini-2.0-flash"
        - "gemini-2.0-flash-lite"
        - "gemini-1.5-flash"
        - "gemini-1.5-pro"
      fetch: true
    titleConvo: true
    titleModel: "gemini-2.0-flash"

  custom:
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "deepseek-r1-distill-llama-70b"
          - "llama-3.1-8b-instant"
        fetch: true
      titleConvo: true
      titleModel: "llama-3.3-70b-versatile"
      modelDisplayLabel: "Groq"

    - name: "Mistral"
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "https://api.mistral.ai/v1"
      models:
        default:
          - "codestral-latest"
          - "mistral-small-latest"
        fetch: true
      titleConvo: true
      titleModel: "mistral-small-latest"
      modelDisplayLabel: "Mistral AI"

    - name: "OpenRouter-Free"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemini-2.0-flash-exp:free"
          - "meta-llama/llama-3.3-70b-instruct:free"
          - "deepseek/deepseek-r1:free"
          - "qwen/qwen-2.5-coder-32b-instruct:free"
          - "mistralai/mistral-small-24b-instruct-2501:free"
        fetch: true
      titleConvo: true
      titleModel: "google/gemini-2.0-flash-exp:free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter (Free)"

# Speech Configuration
speech:
  tts:
    openai:
      url: "${EDGE_TTS_URL}"
      apiKey: "edge-tts-key"
      model: "tts-1"
      voices:
        - "es-PY-TaniaNeural"
        - "es-CO-SalomeNeural"
        - "es-MX-DaliaNeural"
        - "es-MX-JorgeNeural"
        - "es-ES-AlvaroNeural"
        - "es-ES-ElviraNeural"
        - "es-US-AlonsoNeural"
        - "en-US-AvaNeural"
        - "en-US-AndrewNeural"
  speechTab:
    conversationMode: true
    advancedMode: true
    speechToText:
      engineSTT: "browser"
    textToSpeech:
      engineTTS: "external"
      voice: "es-PY-TaniaNeural"
